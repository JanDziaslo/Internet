<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Konto pacjenta</title>
    <link rel="stylesheet" href="styl.css">
</head>
<body>
    <header>
        <h2>Strefa pacjenta</h2>
    </header>

    <nav>
        <a href="index.html">Strona główna</a>
        <a href="recepty.html">Recepty</a>
        <a href="skierowania.html">Skierowania</a>
    </nav>

    <main>
        <section id="lewa1">
            <img src="pliki7/pacjent.png" alt="dane pacjenta">
            <h3>Dane pacjenta</h3>
            <p>Agnieszka</p>
            <p>Nowak</p>
        </section>

        <section id="prawa1">
            <img src="recepta.png" alt="dane recept">
            <h3>Dane recept</h3>
        </section>

        <section id="lewa2">
            <img src="pliki7/lekarz.png" alt="dane lekarza">
            <h3>Dane lekarza</h3>
            <p>lek. Marian Kowal</p>
            <p>numer PWZ: 4387203</p>
        </section>

        <section id="prawa2">


        </section>
    </main>

    <footer>
        <p>Autor strony: <strong><i>Jan Dziąsło</i></strong></p>
    </footer>
</body>
<script>
    var pacjenci = {
        "id": "1",
        "imie": "Agnieszka",
        "nazwisko": "Nowak",
        "wystawca": "lek. Marian Kowal",
        "numer": "4387203",
        "recepty": [
            {"id": "0",  "data": "8.03.2025", "kod": "1220", "lek1": "Witamina C", "lek2": "Potas", "lek3": "Syrop prawoślazowy"},
            {"id": "1",  "data": "23.04.2025", "kod": "4634", "lek1": "APAP", "lek2": "Witamina B", "lek3": ""},
            {"id": "2",  "data": "13.05.2025", "kod": "2913", "lek1": "Melatonina", "lek2": "", "lek3": ""},
            {"id": "3",  "data": "30.10.2025", "kod": "1105", "lek1": "Witamina C", "lek2": "Calcium", "lek3": "Sinupret"}
        ]
    };

    var sekcja = document.getElementById("prawa2");

    for (var i = 0; i < pacjenci.recepty.length; i++) {
        var r = pacjenci.recepty[i];

        var blok = document.createElement("div");
        blok.className = "recepty";

        var p = document.createElement("p");
        p.textContent = "Data wystawienia: " + r.data;
        blok.appendChild(p);

        var ol = document.createElement("ol");
        var leki = [r.lek1, r.lek2, r.lek3];
        for (var j = 0; j < leki.length; j++) {
            if (leki[j] !== "") {
                var li = document.createElement("li");
                li.textContent = leki[j];
                ol.appendChild(li);
            }
        }
        blok.appendChild(ol);

        var h4 = document.createElement("h4");
        h4.textContent = "Kod: " + r.kod;
        blok.appendChild(h4);

        sekcja.appendChild(blok);
    }
</script>
</html>
